<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CSNAP — Pengaturan</title><link rel="stylesheet" href="/csnap/styles.css"></head><body>
<header class="top"><div class="topin">
<div class="logo">⚡ <b>CSNAP</b><span style="font-size:11px;border:1px solid #243056;border-radius:99px;padding:3px 8px;color:#9aa7c7">Pengaturan</span></div>
<div class="lang"><a class="btn ghost" href="/csnap/" style="text-decoration:none">← Buka CSNAP</a></div>
</div></header>
<div class="wrap">
<div class="dlbox sform">
<h2>Pengaturan CSNAP</h2>
<p style="color:#9aa7c7">Konfigurasi iklan disimpan di server dan langsung dipakai halaman CSNAP.</p>
<div id="msg"></div>
<label>Google AdSense — Client ID</label>
<input id="adsenseClient" placeholder="ca-pub-XXXXXXXX — kosongkan utk pakai layanan lain / banner">
<h3>Slot Iklan — 2 perangkat</h3>
<p style="color:#9aa7c7;font-size:13px">Kode iklan (script/HTML) paling prioritas → banner manual → AdSense. Slot desktop tampil di layar ≥768px, mobile di bawahnya.</p>
<div class="g2">
<div class="banner"><h4>🖥️ Desktop</h4>
<label>Kode iklan (script/HTML)</label>
<textarea id="cDesktop" placeholder="<script>…kode dari jaringan iklan (mis. aads.com)…</script>"></textarea>
<label>Banner gambar (fallback)</label>
<input id="bDesktopImg" placeholder="URL gambar banner"><input id="bDesktopUrl" placeholder="URL tujuan klik"><input id="bDesktopAlt" placeholder="Teks alt / caption">
<label>AdSense unit ID (prioritas terakhir)</label>
<input id="slotDesktop" placeholder="ID unit">
<div class="preview" id="pvDesktop"></div></div>
<div class="banner"><h4>📱 Mobile</h4>
<label>Kode iklan (script/HTML)</label>
<textarea id="cMobile" placeholder="<script>…kode dari jaringan iklan…</script>"></textarea>
<label>Banner gambar (fallback)</label>
<input id="bMobileImg" placeholder="URL gambar banner"><input id="bMobileUrl" placeholder="URL tujuan klik"><input id="bMobileAlt" placeholder="Teks alt / caption">
<label>AdSense unit ID (prioritas terakhir)</label>
<input id="slotMobile" placeholder="ID unit">
<div class="preview" id="pvMobile"></div></div>
</div>
<div class="row" style="gap:10px">
<button class="btn" id="save">💾 Simpan</button>
<button class="btn ghost" id="reset">Reset ke default</button>
</div>
</div></div>
<script>
const $=s=>document.querySelector(s);
const msgEl=$('#msg');
function msg(t,c){msgEl.textContent=t;msgEl.className=c||'ok';}
function setInputs(s){
  $('#adsenseClient').value=s.adsenseClient||'';
  $('#slotDesktop').value=(s.adsenseSlots&&s.adsenseSlots.desktop)||'';
  $('#slotMobile').value=(s.adsenseSlots&&s.adsenseSlots.mobile)||'';
  const set=(id,b,code)=>{
    if(!b)return;
    $('#'+id+'Img').value=b.img||'';
    $('#'+id+'Url').value=b.url||'';
    $('#'+id+'Alt').value=b.alt||'Iklan';
    $('#c'+id.slice(1)).value=code||'';
    preview(id,b.img);
  };
  set('bDesktop',s.banners&&s.banners.desktop,s.codes&&s.codes.desktop);set('bMobile',s.banners&&s.banners.mobile,s.codes&&s.codes.mobile);
}
function preview(id,img){
  const p=$('#pv'+id.replace('b',''));
  if(p){p.innerHTML=img?'<img src="'+img+'" onerror="this.style.display=\'none\'">':'<small>belum ada gambar</small>';}
}
async function load(){
  try{
    const r=await fetch('/csnap/api/settings',{credentials:'same-origin'});
    if(r.status===401){msg('Sesi berakhir — arahkan ke login…','err');setTimeout(()=>{location.href='/login';},1200);return;}
    if(!r.ok)throw new Error('HTTP '+r.status);
    setInputs(await r.json());
  }catch(e){msg('Gagal memuat: '+e.message,'err');}
}
async function save(){
  const p={adsenseClient:$('#adsenseClient').value.trim(),
    adsenseSlots:{desktop:$('#slotDesktop').value.trim(),mobile:$('#slotMobile').value.trim()},
    codes:{desktop:$('#cDesktop').value.trim(),mobile:$('#cMobile').value.trim()},
    banners:{
      desktop:pick('bDesktop'),mobile:pick('bMobile')}};
  try{
    const r=await fetch('/csnap/api/settings',{method:'PUT',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify(p)});
    if(r.status===401){msg('Sesi berakhir — arahkan ke login…','err');setTimeout(()=>{location.href='/login';},1200);return;}
    if(!r.ok)throw new Error('HTTP '+r.status);
    const j=await r.json();
    if(j.ok){msg('Tersimpan ✓','ok');setInputs(j.settings);}
  }catch(e){msg('Gagal simpan: '+e.message,'err');}
}
function pick(x){return{img:$('#'+x+'Img').value.trim(),url:$('#'+x+'Url').value.trim(),alt:$('#'+x+'Alt').value.trim()||'Iklan'};}
async function resetAll(){
  if(!confirm('Hapus semua pengaturan iklan?'))return;
  try{
    const r=await fetch('/csnap/api/settings',{method:'PUT',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({adsenseClient:'',adsenseSlots:{desktop:'',mobile:''},codes:{desktop:'',mobile:''},banners:{desktop:{img:'',url:'',alt:'Iklan'},mobile:{img:'',url:'',alt:'Iklan'}}})});
    if(r.status===401){msg('Sesi berakhir — arahkan ke login…','err');setTimeout(()=>{location.href='/login';},1200);return;}
    if(!r.ok)throw new Error('HTTP '+r.status);
    msg('Di-reset ke default ✓','ok');load();
  }catch(e){msg('Gagal reset: '+e.message,'err');}
}
$('#save').onclick=save;
$('#reset').onclick=resetAll;
['bDesktopImg','bMobileImg'].forEach(id=>$('#'+id).addEventListener('input',e=>preview(id.replace('Img',''),e.target.value.trim())));
load();
</script></body></html>
