<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<script>
window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-33CSGGEP7N');

<title>Mengalihkan…</title>
<style>
:root{--bg:#0b1020;--card:#141b33;--line:#243056;--txt:#eaf0ff;--mut:#9aa7c7;--p1:#7c3aed;--p2:#ec4899}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;display:flex;flex-direction:column}
.wrap{max-width:760px;margin:0 auto;padding:28px 18px;width:100%}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px;text-align:center}
.logo b{background:linear-gradient(90deg,var(--p1),var(--p2));-webkit-background-clip:text;background-clip:text;color:transparent}
.mut{color:var(--mut)}
.dl{display:flex;flex-direction:column;align-items:center;gap:10px;margin:22px 0}
.ring{width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--p1) 0deg,var(--line) 0deg);position:relative}
.ring::after{content:attr(data-sec);position:absolute;inset:8px;background:var(--card);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800}
.btn{display:none;margin-top:6px;padding:13px 34px;border:0;border-radius:12px;cursor:pointer;font-size:15px;font-weight:700;color:#fff;background:linear-gradient(90deg,var(--p1),var(--p2));box-shadow:0 8px 24px rgba(124,58,237,.35)}
.btn:hover{filter:brightness(1.08)}
.adslot{min-height:120px;margin:16px 0 0;display:flex;align-items:center;justify-content:center;border:1px dashed var(--line);border-radius:12px;color:var(--mut);font-size:13px;overflow:hidden}
.adslot .adlink img{max-width:100%;height:auto;display:block}
.sp{flex:1}
footer{padding:18px;text-align:center;color:var(--mut);font-size:12px}
</style></head><body>
<div class="wrap">
 <div class="card">
  <p class="logo" style="font-size:20px;font-weight:800;margin-bottom:6px">⚡ <b>CSLINK</b></p>
  <p class="mut">Menyiapkan tujuan Anda…</p>
  <div class="dl" id="dl"><div class="ring" id="ring" data-sec="5">5</div><div class="mut">Anda akan dialihkan dalam <b id="sec">5</b> detik.</div></div>
  <button class="btn" id="go">Lanjutkan →</button>
  <div class="adslot" id="adslot">Memuat iklan…</div>
 </div>
</div>
<div class="sp"></div>
<footer>© 2026 CSLINK — Powered By Percetakan Rainbow</footer>
<script>
window.__AD={dest:__AD_DEST__};
const SEC=__AD_SECONDS__;const AUTO=__AD_AUTO__;
const el=document.getElementById('sec'),ring=document.getElementById('ring'),go=document.getElementById('go');
let left;
let iv=null;
function updateRing(){const deg=(SEC-left)/SEC*360;ring.style.background='conic-gradient(#7c3aed '+deg+'deg,#243056 '+deg+'deg)';}
function tick(){
  left=Math.max(0,left-1);el.textContent=left;ring.dataset.sec=left;updateRing();
  if(left<=0){clearInterval(iv);iv=null;if(AUTO){window.location.href=__AD.dest;}else{el.textContent='Siap!';go.style.display='inline-block';}}
}
function startCountdown(){if(iv)return;left=SEC;el.textContent=left;ring.dataset.sec=left;updateRing();iv=setInterval(tick,1000);}
go.addEventListener('click',()=>{go.disabled=true;window.location.href=__AD.dest;});
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
const ADSLOT=document.getElementById('adslot');
function renderAdBox(c){
  const isDesktop=typeof window.matchMedia==='function'?window.matchMedia('(min-width:768px)').matches:true;
  const key=isDesktop?'desktop':'mobile';
  const code=((c&&c.codes&&c.codes[key])||'').trim();
  const b=(c&&c.banners&&c.banners[key])||{};
  let html='';
  if(code)html=code;
  else if(b.img)html='<a class="adlink" href="'+esc(b.url||'#')+'" target="_blank" rel="noopener sponsored"><img src="'+esc(b.img)+'" alt="'+esc(b.alt||'Iklan')+'" loading="lazy"></a>';
  if(!html){ADSLOT.innerHTML='<span>Mengalihkan…</span>';return false;}
  ADSLOT.innerHTML='';ADSLOT.style.border='none';
  ADSLOT.innerHTML=html;
  return true;
}
(function(){
  (async function(){
    try{const c=await(await fetch('/csnap/api/config')).json();renderAdBox(c);}catch(e){ADSLOT.innerHTML='<span>Mengalihkan…</span>';}
    startCountdown();
  })();
})();
</script></body></html>
