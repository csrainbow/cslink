<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Masuk — Akun CSLINK</title>
<meta name="google-adsense-account" content="ca-pub-8595163342864825">
<script async src="https://www.googletagmanager.com/gtag/js?id=G-33CSGGEP7N"></script>
<script>
window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-33CSGGEP7N');
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  :root{--bg0:#050814;--bg1:#0a0f26;--glass:rgba(255,255,255,.05);--glass2:rgba(255,255,255,.08);--line:rgba(148,184,255,.16);--txt:#e7eeff;--mut:#8fa1ce;--cyan:#22d3ee;--vio:#818cf8;--mag:#e879f9;--grad:linear-gradient(120deg,#22d3ee,#818cf8 50%,#e879f9);--fd:'Space Grotesk',Inter,system-ui,sans-serif;--fb:'Inter',system-ui,Arial,sans-serif}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:var(--fb);background:radial-gradient(1100px 620px at 12% -8%,rgba(129,140,248,.18),transparent 60%),radial-gradient(900px 600px at 90% 8%,rgba(34,211,238,.13),transparent 55%),linear-gradient(180deg,var(--bg0),var(--bg1) 45%,var(--bg0));background-attachment:fixed;color:var(--txt);min-height:100vh;display:flex;flex-direction:column;line-height:1.6}
  .bg-orbs{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
  .orb{position:absolute;border-radius:50%;filter:blur(110px);opacity:.5}
  .orb-1{width:480px;height:480px;left:-140px;top:-120px;background:radial-gradient(circle,rgba(129,140,248,.55),transparent 70%)}
  .orb-2{width:420px;height:420px;right:-120px;top:18%;background:radial-gradient(circle,rgba(34,211,238,.45),transparent 70%)}
  .wrap{max-width:420px;margin:auto;padding:40px 20px;width:100%}
  .brand{display:flex;align-items:center;gap:12px;justify-content:center;margin-bottom:26px}
  .brand-icon{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-weight:700;color:#fff;background:var(--grad);box-shadow:0 12px 30px -10px rgba(34,211,238,.9)}
  .brand-name{font-family:var(--fd);font-size:21px;font-weight:700;letter-spacing:2px;color:#fff}
  .card{background:linear-gradient(160deg,var(--glass2),var(--glass));border:1px solid var(--line);border-radius:22px;backdrop-filter:blur(10px);padding:26px;position:relative;overflow:hidden}
  .card::before{content:'';position:absolute;inset:0 0 auto;height:1px;background:linear-gradient(90deg,transparent,rgba(34,211,238,.8),rgba(232,121,249,.8),transparent)}
  h1{font-family:var(--fd);font-size:21px;color:#fff;text-align:center;margin-bottom:20px}
  label{display:block;font-size:13px;color:var(--mut);margin:12px 0 6px;font-weight:500}
  label i{color:var(--cyan);margin-right:6px}
  input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid rgba(148,184,255,.16);background:rgba(10,15,38,.6);color:#fff;font-size:14px;outline:none;transition:border-color .18s,box-shadow .18s}
  input:focus{border-color:rgba(34,211,238,.65);box-shadow:0 0 0 3px rgba(34,211,238,.14)}
  button{width:100%;margin-top:18px;padding:13px;border:0;border-radius:12px;background:var(--grad);color:#fff;font-family:var(--fd);font-weight:600;font-size:15px;cursor:pointer;box-shadow:0 14px 32px -14px rgba(34,211,238,.8);transition:transform .18s}
  button:hover{transform:translateY(-2px)}
  .msg{margin-top:14px;font-size:13.5px;text-align:center}
  .msg.err{color:#fda4af}
  .foot{text-align:center;margin-top:18px;font-size:13.5px;color:#6b7ca6}
  .foot a{color:var(--cyan);text-decoration:none}
</style>
</head>
<body>
  <div class="bg-orbs"><span class="orb orb-1"></span><span class="orb orb-2"></span></div>
  <div class="wrap">
    <div class="brand"><div class="brand-icon">CS</div><div class="brand-name">CSLINK</div></div>
    <div class="card">
      <h1>Masuk ke Akun</h1>
      <form id="login-form">
        <label><i class="fas fa-envelope"></i>Email</label>
        <input type="email" id="email" placeholder="nama@email.com" autocomplete="email" required>
        <label><i class="fas fa-lock"></i>Password</label>
        <input type="password" id="password" placeholder="Password" autocomplete="current-password" required>
        <button type="submit">Masuk</button>
        <div class="msg" id="msg"></div>
      </form>
      <div class="foot">Belum punya akun? <a href="/register">Daftar gratis</a></div>
    </div>
  </div>
<script>
document.getElementById('login-form').addEventListener('submit',async e=>{
  e.preventDefault();
  const m=document.getElementById('msg');m.className='msg';m.textContent='Memproses…';
  try{
    const r=await fetch('/api/member/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value,password:document.getElementById('password').value})});
    const d=await r.json();
    if(!d.ok){m.textContent=d.error||'Login gagal';m.className+=' err';return;}
    location.href='/member';
  }catch(err){m.textContent='Terjadi kesalahan.';m.className+=' err';}
});
</script>
</body>
</html>
